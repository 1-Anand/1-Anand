<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" style="background:#090d16;border-radius:12px;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="50%" stop-color="#0072FF"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </linearGradient>

    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .terminal-header { fill: #1e293b; }
    .dot-red { fill: #ef4444; }
    .dot-yellow { fill: #f59e0b; }
    .dot-green { fill: #10b981; }
    .pipeline-line { stroke: #334155; stroke-dasharray: 6; stroke-width: 2.5; animation: dash 20s linear infinite; }
    .pulse-line { stroke: url(#cyanPurple); stroke-width: 2.5; }
    .node-box { fill: url(#nodeGrad); stroke: #334155; stroke-width: 1.5; rx: 10px; transition: all 0.3s ease; }
    .node-box-active { fill: url(#nodeGrad); stroke: #38bdf8; stroke-width: 2; rx: 10px; }
    .title-text { font-size: 26px; font-weight: 800; fill: #ffffff; letter-spacing: 1.5px; }
    .subtitle-text { font-size: 14px; font-weight: 500; fill: #94a3b8; }
    .node-title { font-size: 13px; font-weight: 700; fill: #f1f5f9; text-anchor: middle; }
    .node-sub { font-size: 11px; font-weight: 500; fill: #94a3b8; text-anchor: middle; }
    .badge-bg { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 6px; }
    .badge-text { font-size: 11px; font-weight: 600; fill: #38bdf8; text-anchor: middle; }
    @keyframes dash { to { stroke-dashoffset: -1000; } }
  </style>

  <!-- Background Rect with Border -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="12" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Tech Grid -->
  <g opacity="0.05">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300 M 0,360 L 1200,360" stroke="#ffffff" stroke-width="1"/>
    <path d="M 150,0 L 150,420 M 300,0 L 300,420 M 450,0 L 450,420 M 600,0 L 600,420 M 750,0 L 750,420 M 900,0 L 900,420 M 1050,0 L 1050,420" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Top Terminal Bar -->
  <path d="M 0,0 L 1200,0 L 1200,44 L 0,44 Z" fill="#0f172a" rx="12"/>
  <circle cx="28" cy="22" r="6" class="dot-red" />
  <circle cx="48" cy="22" r="6" class="dot-yellow" />
  <circle cx="68" cy="22" r="6" class="dot-green" />
  <text x="600" y="27" fill="#64748b" font-size="12" font-family="'Fira Code', monospace" text-anchor="middle">anand-bhushan@platform-architect: ~ / enterprise-devops-flow</text>

  <!-- Header Branding Section -->
  <g transform="translate(60, 80)">
    <!-- Main Headline -->
    <text x="0" y="24" class="title-text">
      ANAND BHUSHAN <tspan fill="url(#cyanPurple)">|</tspan> <tspan fill="#38bdf8" font-size="20">CLOUD DEVOPS ARCHITECT</tspan>
    </text>
    <text x="0" y="52" class="subtitle-text">
      10+ Years IT • 6.5+ Years Azure &amp; DevOps • CKA (Certified Kubernetes Administrator) • AZ-400 • AZ-104 • AI-102
    </text>

    <!-- Credential Pills -->
    <g transform="translate(700, 0)">
      <rect x="0" y="5" width="85" height="26" class="badge-bg" stroke="#38bdf8"/>
      <text x="42" y="22" class="badge-text">☸️ CKA</text>

      <rect x="95" y="5" width="95" height="26" class="badge-bg" stroke="#0284c7"/>
      <text x="142" y="22" class="badge-text" fill="#0284c7">☁️ AZ-400</text>

      <rect x="200" y="5" width="95" height="26" class="badge-bg" stroke="#0072FF"/>
      <text x="247" y="22" class="badge-text" fill="#38bdf8">🛡️ AZ-104</text>

      <rect x="305" y="5" width="95" height="26" class="badge-bg" stroke="#c084fc"/>
      <text x="352" y="22" class="badge-text" fill="#c084fc">🤖 AI-102</text>
    </g>
  </g>

  <!-- Connecting Pipeline Stream Line -->
  <path d="M 125,245 L 1075,245" class="pipeline-line" />
  <path d="M 125,245 L 1075,245" class="pulse-line" opacity="0.6"/>

  <!-- 6 Pipeline Nodes -->

  <!-- Node 1: Code & Repos -->
  <g transform="translate(65, 185)">
    <rect width="135" height="115" class="node-box" />
    <circle cx="67" cy="30" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="67" y="35" font-size="16" text-anchor="middle">💻</text>
    <text x="67" y="65" class="node-title">1. Plan &amp; Code</text>
    <text x="67" y="85" class="node-sub">Git • VS Code</text>
    <text x="67" y="100" class="node-sub" fill="#38bdf8">Linux • Python • Bash</text>
  </g>

  <!-- Node 2: CI & Automation -->
  <g transform="translate(245, 185)">
    <rect width="135" height="115" class="node-box" />
    <circle cx="67" cy="30" r="16" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
    <text x="67" y="35" font-size="16" text-anchor="middle">⚡</text>
    <text x="67" y="65" class="node-title">2. Multi-Stage CI</text>
    <text x="67" y="85" class="node-sub">Azure Pipelines</text>
    <text x="67" y="100" class="node-sub" fill="#38bdf8">GitHub Actions (YAML)</text>
  </g>

  <!-- Node 3: Shift-Left Security -->
  <g transform="translate(425, 185)">
    <rect width="135" height="115" class="node-box-active" />
    <circle cx="67" cy="30" r="16" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="67" y="35" font-size="16" text-anchor="middle">🛡️</text>
    <text x="67" y="65" class="node-title">3. DevSecOps</text>
    <text x="67" y="85" class="node-sub">SonarQube • Trivy</text>
    <text x="67" y="100" class="node-sub" fill="#4ade80">Gitleaks • Key Vault</text>
  </g>

  <!-- Node 4: IaC & Cloud Foundation -->
  <g transform="translate(605, 185)">
    <rect width="135" height="115" class="node-box" />
    <circle cx="67" cy="30" r="16" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="67" y="35" font-size="16" text-anchor="middle">🏗️</text>
    <text x="67" y="65" class="node-title">4. Modern IaC</text>
    <text x="67" y="85" class="node-sub">Terraform Modules</text>
    <text x="67" y="100" class="node-sub" fill="#c084fc">ARM • Bicep • Remote State</text>
  </g>

  <!-- Node 5: Containers & GitOps -->
  <g transform="translate(785, 185)">
    <rect width="135" height="115" class="node-box-active" />
    <circle cx="67" cy="30" r="16" fill="#1e293b" stroke="#326CE5" stroke-width="1.5"/>
    <text x="67" y="35" font-size="16" text-anchor="middle">☸️</text>
    <text x="67" y="65" class="node-title">5. AKS &amp; GitOps</text>
    <text x="67" y="85" class="node-sub">Kubernetes • Docker</text>
    <text x="67" y="100" class="node-sub" fill="#38bdf8">Helm • Argo CD • ACA</text>
  </g>

  <!-- Node 6: Observability & SRE -->
  <g transform="translate(965, 185)">
    <rect width="135" height="115" class="node-box" />
    <circle cx="67" cy="30" r="16" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="67" y="35" font-size="16" text-anchor="middle">📊</text>
    <text x="67" y="65" class="node-title">6. SRE &amp; Metrics</text>
    <text x="67" y="85" class="node-sub">Prometheus • Grafana</text>
    <text x="67" y="100" class="node-sub" fill="#f59e0b">Azure Monitor • KQL</text>
  </g>

  <!-- Bottom Enterprise Architectural Standards Footer -->
  <g transform="translate(60, 350)">
    <rect width="1080" height="42" fill="#0b1329" stroke="#1e293b" stroke-width="1" rx="8"/>
    <text x="540" y="26" fill="#94a3b8" font-size="12" text-anchor="middle">
      <tspan fill="#38bdf8" font-weight="700">🔒 Zero-Trust Architecture:</tspan> Private Endpoints &amp; VNet Isolation • 
      <tspan fill="#38bdf8" font-weight="700">⚡ Ephemeral Build Farm:</tspan> Self-Hosted ACA Agents • 
      <tspan fill="#38bdf8" font-weight="700">📜 Declarative GitOps:</tspan> ArgoCD Automated Drift Healing • 
      <tspan fill="#38bdf8" font-weight="700">🚀 Availability:</tspan> 99.95% SLA
    </text>
  </g>
</svg>
